name: Build and push docker image

on:
  workflow_call:

    inputs:
      AWS_REGION:
        required: true
        type: string
      AWS_ROLE_TO_ASSUME:
        required: false
        type: string
      DOCKER_REPO:
        required: true
        type: string
      DOCKER_TARGET:
        required: false
        type: string
      DOCKER_CONTEXT:
        required: false
        type: string
        default: "."
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

    outputs:
      tags:
        description: "Docker image tags"
        value: ${{ jobs.build_and_push.outputs.tags }}

jobs:
  build_and_push:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ inputs.AWS_ROLE_TO_ASSUME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calculate Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.DOCKER_REPO }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.DOCKER_CONTEXT }}
          target: ${{ inputs.DOCKER_TARGET }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
#          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.DOCKER_REPO }}:buildcache
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.DOCKER_REPO }}:add-gha
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.DOCKER_REPO }}:buildcache,mode=max
